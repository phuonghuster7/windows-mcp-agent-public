name: Bug report
description: Report a reproducible, non-sensitive software issue
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not paste OAuth tokens, API keys, private tunnel IDs, personal files, or unredacted logs. For vulnerabilities, use private security reporting."
  - type: input
    id: version
    attributes:
      label: Release/version
      placeholder: v1.0.0-rc3
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use a minimal example without personal data
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment (redacted)
      description: Windows version, Python version, plugin mode, relevant error category
